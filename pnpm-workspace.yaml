packages:
  - apps/*
  - packages/*

autoInstallPeers: true
engineStrict: true
saveExact: true
strictPeerDependencies: true

overrides:
  '@expo/plist>@xmldom/xmldom': 0.8.15
  'plist>@xmldom/xmldom': 0.9.12
  react: 19.2.3
  react-dom: 19.2.3

supportedArchitectures:
  os: [current, darwin, linux]
  cpu: [current, arm64, x64]
  libc: [current, glibc, musl]

allowBuilds:
  esbuild: true
  sharp: true

# Approved for the coordinated Expo 57.0.18 compatibility release. Remove
# after 2026-08-29T10:50:37.297Z, when the newest entry is 24 hours old.
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.20'
  - '@expo/env@2.4.3'
  - '@expo/fingerprint@0.20.11'
  - '@expo/metro-config@57.0.12'
  - expo-constants@57.0.16
  - expo-font@57.0.2
  - expo@57.0.18
