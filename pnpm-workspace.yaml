packages:
  - apps/*
  - packages/*

autoInstallPeers: true
engineStrict: true
pmOnFail: error
saveExact: true
strictPeerDependencies: true

overrides:
  '@expo/plist>@xmldom/xmldom': 0.8.15
  'plist>@xmldom/xmldom': 0.9.12
  react: 19.2.3
  react-dom: 19.2.3

supportedArchitectures:
  os: [current, darwin, linux]
  cpu: [current, arm64, x64]
  libc: [current, glibc, musl]

allowBuilds:
  esbuild: true
  sharp: true
