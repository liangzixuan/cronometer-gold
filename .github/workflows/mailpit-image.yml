name: Mailpit image

on:
  push:
    branches: [codex/retention-features]
    paths:
      - .github/workflows/mailpit-image.yml
      - .dockerignore
      - infra/docker/mailpit.Dockerfile
      - infra/docker/mailpit-build-inputs.json
      - infra/docker/mailpit-NOTICES.txt
      - infra/docker/mailpit-go-licenses.go.mod
      - infra/docker/mailpit-go-licenses.go.sum
      - scripts/verify-mailpit-build.mjs
      - scripts/verify-mailpit-image.mjs
      - scripts/verify-oci-buildkit-attestations.mjs
      - scripts/mailpit-build.test.mjs
      - scripts/verify-mailpit-image.test.mjs
      - scripts/mailpit-image-workflow.test.mjs
      - scripts/workflow-contract-helpers.mjs
      - scripts/license-policy.mjs
      - scripts/license-policy.test.mjs
      - scripts/check-licenses.mjs
      - config/license-policy.json

permissions:
  contents: read

concurrency:
  group: mailpit-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mailpit-image:
    name: build, scan, publish (mailpit)
    if: github.repository == 'liangzixuan/cronometer-gold' && github.ref == 'refs/heads/codex/retention-features'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      ref: ${{ steps.export.outputs.ref }}
      runtime-ref: ${{ steps.export.outputs.runtime-ref }}
    env:
      MAILPIT_IMAGE: ghcr.io/liangzixuan/cronometer-gold-mailpit
    steps:
      - name: Require the approved Mailpit publication context
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "${EVENT_NAME}" = push
          test "${SOURCE_REF}" = refs/heads/codex/retention-features
          test "${SOURCE_REPOSITORY}" = liangzixuan/cronometer-gold
          test "${REVISION}" = "${WORKFLOW_REVISION}"
          test "${RUNNER_ARCH}" = ARM64
          test "$(uname -m)" = aarch64

      - name: Check out Mailpit source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check the Mailpit source contracts
        run: node --test scripts/license-policy.test.mjs scripts/mailpit-build.test.mjs scripts/verify-mailpit-image.test.mjs scripts/mailpit-image-workflow.test.mjs

      - name: Set up pinned Mailpit Buildx and BuildKit
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          cache-binary: false

      - name: Install pinned Mailpit Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Log in for the project Mailpit image
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the immutable Mailpit commit tag
        id: existing
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          error_file="${RUNNER_TEMP}/Mailpit-existing-error.txt"
          if manifest="$(docker buildx imagetools inspect "${MAILPIT_IMAGE}:sha-${REVISION}" --format '{{json .Manifest}}' 2>"${error_file}")"; then
            digest="$(printf '%s' "${manifest}" | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')"
            printf 'exists=true\ndigest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"
          else
            grep -Eiq 'manifest unknown|not found' "${error_file}" || { cat "${error_file}" >&2; exit 1; }
            printf 'exists=false\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: Build the Mailpit candidate by digest
        id: build
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/docker/mailpit.Dockerfile
          target: runtime
          platforms: linux/arm64
          pull: true
          build-args: REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/liangzixuan/cronometer-gold
            org.opencontainers.image.title=cronometer-gold-mailpit
            org.opencontainers.image.version=v1.31.3
          outputs: type=image,name=${{ env.MAILPIT_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max,version=v1
          sbom: generator=docker.io/docker/buildkit-syft-scanner@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68

      - name: Export the exact Mailpit build evidence
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/docker/mailpit.Dockerfile
          target: build-evidence
          platforms: linux/arm64
          pull: true
          build-args: REVISION=${{ github.sha }}
          outputs: type=local,dest=${{ runner.temp }}/mailpit-build-evidence

      - name: Select the exact Mailpit candidate
        id: candidate
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          EXISTING_TAG: ${{ steps.existing.outputs.exists }}
        run: |
          set -euo pipefail
          if [ "${EXISTING_TAG}" = true ]; then digest="${EXISTING_DIGEST}"; else digest="${BUILT_DIGEST}"; fi
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\nref=%s@%s\n' "${digest}" "${MAILPIT_IMAGE}" "${digest}" >> "${GITHUB_OUTPUT}"
          cd "${RUNNER_TEMP}/mailpit-build-evidence"
          for evidence in go.mod go.sum mailpit-modules.txt mailpit-imports.txt tool-modules.txt tool-imports.txt mailpit-buildinfo.txt mailpit.sha256 npm-audit.json npm-verification.json source-verification.json frontend-assets.json frontend-metafile.json graph-verification.json notices-verification.json go-notices.txt go-notice-warnings.txt Go-LICENSE licenses/NOTICES.txt; do
            test -f "${evidence}"
            sha256sum "${evidence}"
            wc --bytes "${evidence}"
            printf '::group::mailpit-build-evidence/%s (base64)\n' "${evidence}"
            base64 --wrap=76 "${evidence}"
            printf '::endgroup::\n'
          done

      - name: Verify Mailpit identity without running mailpit
        env:
          IMAGE_REF: ${{ steps.candidate.outputs.ref }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/verify-mailpit-image.mjs identity \
            --image-ref "${IMAGE_REF}" --revision "${REVISION}" \
            --workflow-sha "${GITHUB_WORKFLOW_SHA}" --source-ref "${GITHUB_REF}" \
            | tee "${RUNNER_TEMP}/Mailpit-candidate-identity.json"
          binary_sha="$(jq -er '.binarySha256 | select(test("^[0-9a-f]{64}$"))' "${RUNNER_TEMP}/Mailpit-candidate-identity.json")"
          test "$(cat "${RUNNER_TEMP}/mailpit-build-evidence/mailpit.sha256")" = "${binary_sha}  /out/mailpit"

      - name: Initialize an empty mailpit vulnerability-ignore policy
        run: install -m 600 /dev/null "${RUNNER_TEMP}/mailpit.trivyignore"

      - name: Reject all high and critical mailpit vulnerabilities
        env:
          TRIVY_PLATFORM: linux/arm64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: ${{ steps.candidate.outputs.ref }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: ${{ runner.temp }}/mailpit.trivyignore
          exit-code: "1"
          format: table
          hide-progress: true
          timeout: 15m
          cache: false

      - name: Inventory the Mailpit image
        env:
          TRIVY_PLATFORM: linux/arm64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          skip-setup-trivy: true
          scan-type: image
          image-ref: ${{ steps.candidate.outputs.ref }}
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: ${{ runner.temp }}/mailpit.trivyignore
          list-all-pkgs: true
          exit-code: "0"
          format: json
          output: ${{ runner.temp }}/mailpit-trivy-inventory.json
          hide-progress: true
          timeout: 15m
          cache: false

      - name: Require complete Mailpit binary scan coverage
        run: |
          set -euo pipefail
          test ! -s "${RUNNER_TEMP}/mailpit.trivyignore"
          node scripts/verify-mailpit-image.mjs scan "${RUNNER_TEMP}/mailpit-trivy-inventory.json"

      - name: Sign the scanned project Mailpit digest
        if: steps.existing.outputs.exists != 'true'
        env:
          IMAGE_REF: ${{ steps.candidate.outputs.ref }}
        run: |
          set -euo pipefail
          cosign sign --yes --new-bundle-format=true "${IMAGE_REF}"

      - name: Attest the scanned project Mailpit digest
        if: steps.existing.outputs.exists != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.MAILPIT_IMAGE }}
          subject-digest: ${{ steps.candidate.outputs.digest }}
          push-to-registry: true

      - name: Verify the signed same-source Mailpit digest
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ steps.candidate.outputs.ref }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/verify-mailpit-image.mjs verify \
            --image-ref "${IMAGE_REF}" --revision "${REVISION}" \
            --workflow-sha "${GITHUB_WORKFLOW_SHA}" --source-ref "${GITHUB_REF}" \
            | tee "${RUNNER_TEMP}/Mailpit-verified.json"

      - name: Publish the immutable verified Mailpit tag
        if: steps.existing.outputs.exists != 'true'
        env:
          IMAGE_REF: ${{ steps.candidate.outputs.ref }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${MAILPIT_IMAGE}:sha-${REVISION}" "${IMAGE_REF}"

      - name: Export the verified Mailpit digest
        id: export
        env:
          IMAGE_REF: ${{ steps.candidate.outputs.ref }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          manifest="$(docker buildx imagetools inspect "${MAILPIT_IMAGE}:sha-${REVISION}" --format '{{json .Manifest}}')"
          test "$(printf '%s' "${manifest}" | jq -er '.digest')" = "${DIGEST}"
          test "$(jq -er '.ref' "${RUNNER_TEMP}/Mailpit-verified.json")" = "${IMAGE_REF}"
          runtime_ref="$(jq -er '.runtimeRef | select(test("^ghcr.io/liangzixuan/cronometer-gold-mailpit@sha256:[0-9a-f]{64}$"))' "${RUNNER_TEMP}/Mailpit-verified.json")"
          printf 'ref=%s\nruntime-ref=%s\n' "${IMAGE_REF}" "${runtime_ref}" >> "${GITHUB_OUTPUT}"
