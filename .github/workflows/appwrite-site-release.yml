name: appwrite-site-release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare an inactive candidate or activate a measured candidate
        type: choice
        options: [prepare, activate]
        required: true
        default: prepare
      target:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true
        default: staging
      evidence_zip_base64:
        description: Base64 ZIP of bounded inert qualification JSON and applicable candidate receipts; no credentials
        type: string
        required: true
      promote:
        description: Explicitly authorize this production preparation or activation within the approved environment scope
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: appwrite-site-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'liangzixuan/cronometer-gold' && github.ref == 'refs/heads/codex/retention-features' && github.event_name == 'workflow_dispatch' && (inputs.target == 'staging' || inputs.promote)
    environment: appwrite-${{ inputs.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.2
      - name: Install the locked release tools without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the checked-in shared evidence serializer
        run: pnpm --filter @nutrition-tracker/contracts build
      - name: Read only bounded inert measurement evidence for this exact revision
        env:
          EVIDENCE_ZIP_BASE64: ${{ inputs.evidence_zip_base64 }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          RELEASE_TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import importlib.util
          import os
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "evidence", "scripts/appwrite/evidence-artifact.py")
          evidence = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(evidence)
          encoded = os.environ["EVIDENCE_ZIP_BASE64"]
          evidence.require(0 < len(encoded) <= 60_000 and encoded.isascii())
          archive = base64.b64decode(encoded, validate=True)
          files = evidence.review_files(
              archive, hashlib.sha256(archive).hexdigest(),
              os.environ["RELEASE_OPERATION"], os.environ["RELEASE_TARGET"])
          output = Path(os.environ["RUNNER_TEMP"]) / "appwrite-evidence"
          evidence.require(not output.exists() and not output.is_symlink())
          output.mkdir(mode=0o700)
          for name, data in files.items():
              fd = os.open(output / name,
                           os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
              with os.fdopen(fd, "wb") as handle:
                  handle.write(data)
          PY
      - name: Admit actual current source, jobs, browser run and environment configuration
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ inputs.target }}
        run: >-
          pnpm exec tsx scripts/appwrite/github-checks.ts
          --target "$RELEASE_TARGET" --revision "$GITHUB_SHA"
          --out "$RUNNER_TEMP/release-github-evidence.json"
      - name: Prepare the exact tracked-source archive without artifact execution
        run: pnpm exec tsx scripts/appwrite/source-artifact.ts prepare --repo . --revision "$GITHUB_SHA" --out "$RUNNER_TEMP/appwrite-source"
      - name: Verify qualification and perform the selected bounded phase
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          RELEASE_TARGET: ${{ inputs.target }}
          APPWRITE_DEPLOY_KEY: ${{ secrets.APPWRITE_DEPLOY_KEY }}
          APPWRITE_BACKEND_READINESS_TOKEN: ${{ secrets.APPWRITE_BACKEND_READINESS_TOKEN }}
          APPWRITE_STAGING_READINESS_TOKEN: ${{ secrets.APPWRITE_STAGING_READINESS_TOKEN }}
          APPWRITE_SITE_ID: ${{ vars.APPWRITE_SITE_ID }}
          APPWRITE_OTHER_SITE_ID: ${{ vars.APPWRITE_OTHER_SITE_ID }}
          WEB_PUBLIC_ORIGIN: ${{ vars.WEB_PUBLIC_ORIGIN }}
          API_INTERNAL_URL: ${{ vars.API_INTERNAL_URL }}
          APPWRITE_BUILD_SPECIFICATION: ${{ vars.APPWRITE_BUILD_SPECIFICATION }}
          APPWRITE_RUNTIME_SPECIFICATION: ${{ vars.APPWRITE_RUNTIME_SPECIFICATION }}
        shell: bash
        run: |
          set -euo pipefail
          args=("$RELEASE_OPERATION" --target "$RELEASE_TARGET"
            --artifact "$RUNNER_TEMP/appwrite-source"
            --github-evidence "$RUNNER_TEMP/release-github-evidence.json"
            --qualification "$RUNNER_TEMP/appwrite-evidence/qualification.json"
            --receipt "$RUNNER_TEMP/release-receipt.json")
          if [[ "$RELEASE_OPERATION" == "activate" ]]; then
            args+=(--candidate-receipt "$RUNNER_TEMP/appwrite-evidence/candidate-receipt.json")
          fi
          if [[ "$RELEASE_TARGET" == "production" ]]; then
            args+=(--staging-config "$RUNNER_TEMP/appwrite-evidence/staging-config.json"
              --staging-receipt "$RUNNER_TEMP/appwrite-evidence/staging-receipt.json")
          fi
          pnpm exec tsx scripts/appwrite/site-release.ts "${args[@]}"
      - name: Retain bounded phase receipt for reconciliation
        if: always() && steps.release.outcome != 'skipped' && steps.release.outcome != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appwrite-${{ inputs.target }}-${{ inputs.operation }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-receipt.json
          if-no-files-found: error
          retention-days: 1
