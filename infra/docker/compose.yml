name: nutrition-tracker-local

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutrition_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-nutrition_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutrition_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [nutrition-local]

  meilisearch:
    image: getmeili/meilisearch:v1.32.0@sha256:61b1c86c459fa52d0653516f573702791e611574737dc76175ae9d2628c911f5
    restart: unless-stopped
    environment:
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-local-meili-key-not-for-production}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:${MEILI_PORT:-7700}:7700"
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:7700/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [nutrition-local]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nutrition_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nutrition_local_password_only}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [nutrition-local]

  minio-bootstrap:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/nutrition-private-exports
        mc mb --ignore-existing local/nutrition-erasure-ledger
        mc anonymous set none local/nutrition-private-exports
        mc anonymous set none local/nutrition-erasure-ledger
        mc admin policy create local nutrition-export-writer /policies/export-writer-policy.json
        mc admin policy create local nutrition-export-reader /policies/export-reader-policy.json
        mc admin policy create local nutrition-erasure-writer /policies/erasure-writer-policy.json
        mc admin policy create local nutrition-erasure-restore /policies/erasure-restore-policy.json
        mc admin user add local "$${EXPORT_WRITE_USER}" "$${EXPORT_WRITE_PASSWORD}"
        mc admin user add local "$${EXPORT_READ_USER}" "$${EXPORT_READ_PASSWORD}"
        mc admin user add local "$${ERASURE_WRITE_USER}" "$${ERASURE_WRITE_PASSWORD}"
        mc admin user add local "$${ERASURE_RESTORE_USER}" "$${ERASURE_RESTORE_PASSWORD}"
        mc admin policy attach local nutrition-export-writer --user "$${EXPORT_WRITE_USER}"
        mc admin policy attach local nutrition-export-reader --user "$${EXPORT_READ_USER}"
        mc admin policy attach local nutrition-erasure-writer --user "$${ERASURE_WRITE_USER}"
        mc admin policy attach local nutrition-erasure-restore --user "$${ERASURE_RESTORE_USER}"
        mc version suspend local/nutrition-private-exports
        mc version enable local/nutrition-erasure-ledger
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nutrition_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nutrition_local_password_only}
      EXPORT_WRITE_USER: ${EXPORT_ARTIFACT_WRITE_ACCESS_KEY_ID:-nutrition_export_writer}
      EXPORT_WRITE_PASSWORD: ${EXPORT_ARTIFACT_WRITE_SECRET_ACCESS_KEY:-nutrition_export_writer_local_only}
      EXPORT_READ_USER: ${EXPORT_ARTIFACT_READ_ACCESS_KEY_ID:-nutrition_export_reader}
      EXPORT_READ_PASSWORD: ${EXPORT_ARTIFACT_READ_SECRET_ACCESS_KEY:-nutrition_export_reader_local_only}
      ERASURE_WRITE_USER: ${ERASURE_REPLAY_LEDGER_WRITE_ACCESS_KEY_ID:-nutrition_erasure_writer}
      ERASURE_WRITE_PASSWORD: ${ERASURE_REPLAY_LEDGER_WRITE_SECRET_ACCESS_KEY:-nutrition_erasure_writer_local_only}
      ERASURE_RESTORE_USER: ${ERASURE_REPLAY_LEDGER_RESTORE_ACCESS_KEY_ID:-nutrition_erasure_restore}
      ERASURE_RESTORE_PASSWORD: ${ERASURE_REPLAY_LEDGER_RESTORE_SECRET_ACCESS_KEY:-nutrition_erasure_restore_local_only}
    volumes:
      - ../minio:/policies:ro
    networks: [nutrition-local]

  mailpit:
    image: axllent/mailpit:v1.29.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks: [nutrition-local]

networks:
  nutrition-local:
    driver: bridge

volumes:
  postgres-data:
  meilisearch-data:
  minio-data:
