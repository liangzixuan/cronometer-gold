name: nutrition-tracker-local

services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutrition_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-nutrition_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutrition_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [nutrition-local]

  meilisearch:
    image: getmeili/meilisearch:v1.32.0@sha256:61b1c86c459fa52d0653516f573702791e611574737dc76175ae9d2628c911f5
    restart: unless-stopped
    environment:
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-local-meili-key-not-for-production}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:${MEILI_PORT:-7700}:7700"
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:7700/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [nutrition-local]

  object-store:
    image: ghcr.io/chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    restart: unless-stopped
    cpus: 2
    mem_limit: 1g
    pids_limit: 256
    command:
      - server
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=127.0.0.1
      - -filer
      - -s3
      - -s3.ip.bind=0.0.0.0
      - -s3.port=9000
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.config=/config/s3.json
      - -s3.iam.readOnly=true
      - -s3.autoCreateBucket=false
      - -s3.allowDeleteBucketNotEmpty=false
      - -volume.max=16
      - -master.volumeSizeLimitMB=64
      - -master.telemetry=false
    ports:
      - "127.0.0.1:${OBJECT_STORE_PORT:-9000}:9000"
    volumes:
      - object-store-data:/data
      - type: bind
        source: ../../.local-data/object-store/s3.json
        target: /config/s3.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/readyz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [nutrition-local]

  mailpit:
    image: axllent/mailpit:v1.29.4@sha256:0530ab1c658a0f225f148e617522db84053bd1e4879e664c23de5fee44ad6819
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks: [nutrition-local]

networks:
  nutrition-local:
    driver: bridge

volumes:
  postgres-data:
  meilisearch-data:
  object-store-data:
